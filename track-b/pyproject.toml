[project]
name = "regdocs-track-b"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    # langchain-core is LangChain's base package (BaseRetriever, Document); the
    # full `langchain` bundle isn't needed for a retriever.
    "langchain-core>=1.0",
    # The orchestration graph (graph.py).
    "langgraph>=1.0",
    # ChatOllama, the real chat model (opt-in tests; local, so cost 0).
    "langchain-ollama>=1.0",
    # The retriever reuses store's db and embed modules.
    "regdocs-store",
    # The tests validate Events against schema's Event schema, and the
    # parity test reuses eval's match rule.
    "regdocs-schema",
    "regdocs-eval",
]

[tool.uv.sources]
regdocs-store = { workspace = true }
regdocs-schema = { workspace = true }
regdocs-eval = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
