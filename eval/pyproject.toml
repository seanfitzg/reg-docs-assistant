[project]
name = "regdocs-eval"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "jsonschema[format]>=4.23",
    # run_eval.py reuses store's db and embed modules.
    "regdocs-store",
]

[tool.uv.sources]
regdocs-store = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"
